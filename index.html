<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Kvitko Sweet - květinový obchod s ukrajinským nádechem. Nabízíme čerstvé květiny, pokojové rostliny a dárkové předměty." />
    <meta name="keywords" content="květiny, květinový obchod, růže, tulipány, květinové dárky, květinová doprava" />
    <meta name="theme-color" content="#ffffff" />

    <meta property="og:title" content="Kvitko Sweet - Květinový obchod" />
    <meta property="og:description"
        content="Kvitko Sweet - květinový obchod s ukrajinským nádechem. Nabízíme čerstvé květiny, pokojové rostliny a dárkové předměty." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/hero-image.svg" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preconnect для картинок из Firebase Storage — ускоряет первую загрузку -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
    <!--
      Шрифты загружаем асинхронно: rel="preload" + onload-swap.
      Это убирает Google Fonts из render-blocking путём, FCP стартует на ~340ms раньше.
      Fallback <noscript> для пользователей без JS.
    -->
    <link
        rel="preload"
        as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet"
              href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
    </noscript>
    <title>Kvitko Sweet - Květinový obchod</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
